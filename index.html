
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wellen">
<title>Mein Schiff Wellen-Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin:0; height:100%; font-family:-apple-system,Helvetica,sans-serif; }
  #map { position:absolute; inset:0 320px 0 0; }
  #panel { position:absolute; top:0; right:0; bottom:0; width:320px; overflow:auto; background:#0b2540; color:#fff; padding:12px; box-sizing:border-box; }
  h1 { font-size:18px; margin:0 0 8px; }
  .ship { background:#12365c; border-radius:10px; padding:10px; margin-bottom:10px; cursor:pointer; }
  .ship b { font-size:15px; }
  .wave { font-size:22px; font-weight:600; }
  .ok { color:#6fe38f; } .mid { color:#ffd36b; } .high { color:#ff7b7b; }
  small { opacity:.75; }
  button { width:100%; padding:10px; border:0; border-radius:8px; background:#2f7fd1; color:#fff; font-size:15px; margin-bottom:10px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Mein Schiff Wellen-Tracker</h1>
  <button onclick="loadAll()">Aktualisieren</button>
  <div id="list"></div>
  <small>Positionen sind Beispieldaten. Wellendaten: Open-Meteo Marine.</small>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Beispielschiffe mit Beispielrouten (Lat, Lon). Später durch AIS-Daten ersetzen.
const ships = [
  { name:'Mein Schiff 1', pos:[36.0,-5.6], route:[[43.3,-2.0],[40.0,-4.0],[36.0,-5.6],[28.1,-15.4]] },
  { name:'Mein Schiff 4', pos:[57.5,10.5], route:[[54.3,10.1],[57.5,10.5],[59.9,10.7],[60.4,5.3]] },
  { name:'Mein Schiff 6', pos:[35.3,25.1], route:[[37.9,23.7],[35.3,25.1],[34.9,33.0],[31.2,29.9]] },
  { name:'Mein Schiff Relax', pos:[18.2,-66.1], route:[[25.8,-80.2],[18.2,-66.1],[12.5,-69.0],[10.4,-75.5]] }
];

const map = L.map('map').setView([45,10], 4);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap' }).addTo(map);

function cls(h){ return h<1.5 ? 'ok' : h<3 ? 'mid' : 'high'; }

async function waveAt(lat, lon){
  const u = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=wave_height,wave_period,wave_direction`;
  const r = await fetch(u);
  const j = await r.json();
  return j.current || {};
}

async function loadAll(){
  const list = document.getElementById('list');
  list.innerHTML = 'Lade ...';
  map.eachLayer(l => { if(l instanceof L.Marker || l instanceof L.Polyline || l instanceof L.CircleMarker) map.removeLayer(l); });
  let html = '';
  for(const s of ships){
    const here = await waveAt(s.pos[0], s.pos[1]);
    const h = here.wave_height ?? NaN;
    L.polyline(s.route, { color:'#2f7fd1', weight:3, dashArray:'6 6' }).addTo(map);
    for(const p of s.route){
      const w = await waveAt(p[0], p[1]);
      const wh = w.wave_height;
      if(wh != null){
        const col = wh<1.5 ? '#3ccf6e' : wh<3 ? '#f2b705' : '#e5484d';
        L.circleMarker(p, { radius:7, color:col, fillColor:col, fillOpacity:.8 })
          .bindTooltip(wh.toFixed(1)+' m').addTo(map);
      }
    }
    L.marker(s.pos).addTo(map).bindPopup(`<b>${s.name}</b><br>Welle: ${isNaN(h)?'–':h.toFixed(1)+' m'}`);
    html += `<div class="ship" onclick="map.setView([${s.pos[0]},${s.pos[1]}],6)">
      <b>${s.name}</b><br>
      <span class="wave ${isNaN(h)?'':cls(h)}">${isNaN(h)?'–':h.toFixed(1)+' m'}</span><br>
      <small>Periode: ${here.wave_period ?? '–'} s</small></div>`;
  }
  list.innerHTML = html;
}
loadAll();
</script>
</body>
</html>
